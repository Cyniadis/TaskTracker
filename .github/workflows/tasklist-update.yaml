name: Update tasklist PR

on:
  push:
    branches:
      - update-tasklist

permissions:
  contents: write
  pull-requests: write

jobs:
  validate-and-pr:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check only tasklist.json changed
        run: |
          git fetch origin main

          changed_files=$(git diff --name-only origin/main...HEAD)

          echo "Changed files:"
          echo "$changed_files"

          if [ -z "$changed_files" ]; then
            echo "No changes detected."
            exit 1
          fi

          invalid_files=$(echo "$changed_files" | grep -v '^tasklist\.json$' || true)

          if [ -n "$invalid_files" ]; then
            echo "❌ Invalid files modified:"
            echo "$invalid_files"
            echo "Only tasklist.json is allowed."
            exit 1
          fi

          echo "✅ Only tasklist.json changed."

      - name: Create Pull Request
        id: create_pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Check if PR already exists
          pr_number=$(gh pr list \
            --head update-tasklist \
            --base main \
            --json number \
            --jq '.[0].number')

          if [ -z "$pr_number" ]; then
            echo "Creating pull request..."

            gh pr create \
              --base main \
              --head update-tasklist \
              --title "Update tasklist.json" \
              --body "Automated update of tasklist.json"

            pr_number=$(gh pr list \
              --head update-tasklist \
              --base main \
              --json number \
              --jq '.[0].number')
          else
            echo "PR already exists: #$pr_number"
          fi

          echo "pr_number=$pr_number" >> "$GITHUB_OUTPUT"

      - name: Enable auto merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr merge \
            --auto \
            --squash \
            "${{ steps.create_pr.outputs.pr_number }}"